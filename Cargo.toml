[workspace]
resolver = "3"
members = ["lid", "lid-macros"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lid-macros = { path = "lid-macros", version = "0.1.0" }
linkme = "0.3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
trybuild = "1"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
cognitive_complexity = "warn"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
wildcard_enum_match_arm = "deny"
missing_docs_in_private_items = "warn"

[workspace.metadata.lid]
mutation_scope = "diff"
untraced_fallback = "module"

# README §4.3: inlining must not erase a mutation site.
[profile.test]
opt-level = 0
