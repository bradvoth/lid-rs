[workspace]
resolver = "3"
members = ["lid-rs", "lid-rs-macros", "cargo-lid-rs", "lid-rs-shape", "lid-rs-pipeline", "xtask"]

[workspace.package]
version = "0.3.5"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/bradvoth/lid-rs"
homepage = "https://bradvoth.github.io/lid-rs/"

[workspace.dependencies]
lid-rs = { path = "lid-rs", version = "0.3.4" }
lid-rs-macros = { path = "lid-rs-macros", version = "0.3.4" }
lid-rs-shape = { path = "lid-rs-shape", version = "0.3.4" }
linkme = "0.3"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
# Slice 20: `default-features = false` drops `tracing-attributes` and with it a
# second `syn` build. It is needed only by `#[tracing::instrument]`, which is
# the async path `lid-rs/src/validate/lld.md` defers.
tracing = { version = "0.1", default-features = false, features = ["std"] }
trybuild = "1"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
cognitive_complexity = "warn"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
wildcard_enum_match_arm = "deny"
missing_docs_in_private_items = "warn"

[workspace.metadata.lid_rs]
mutation_scope = "diff"
# The workspace's own gate step, run by `phase-check 7` after the floor.
gate_extra = [["mdbook", "build", "book"]]

# README §4.3: inlining must not erase a mutation site.
[profile.test]
opt-level = 0
