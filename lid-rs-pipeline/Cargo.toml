[package]
name = "lid-rs-pipeline"
version.workspace = true
description = "The LID-rs pipeline: a slice built unattended from a draft PR, gated by the cargo-lid-rs catalog."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# `#[derive(Spec)]` and `#[implements]` emit `::lid_rs::…`, which needs `lid_rs`
# in this crate's extern prelude: the transitive path through `cargo-lid-rs`
# does not put it there, so the edge is direct even though nothing here names
# `lid_rs` in source.
lid-rs = { path = "../lid-rs", version = "0.3.5" }
# The session-state readings this slice reuses rather than reimplements —
# `slice_of`, `committed_phases`, `fork_point`, `own_commits`, `log_subjects`
# (`cargo-lid-rs/src/headless_canopy_agent/`) — and `catalog::Finding`, which
# its report links. Reimplementing them would put the same reading in two
# crates, which is the defect this workspace has found three instances of in
# path handling alone.
cargo-lid-rs = { path = "../cargo-lid-rs", version = "0.3.5" }
# `write_report` puts the report under `target/lid/status.json`, so the report
# and every type it holds derive `Serialize`. Not `Deserialize`: nothing in
# this workspace reads the file back, and a test asserting on what was written
# reads it as `serde_json::Value`, which checks the JSON that exists rather
# than a round trip through the types that produced it.
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
