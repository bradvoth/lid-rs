[workspace]
resolver = "2"
members = [
    "bad_line",
    "missing_key",
    "repeated_key",
    "gloss_missing",
    "gloss_repeated",
    "unknown_key",
    "prohibited_key",
    "verb_twice",
    "prohibited_repeat",
    "bad_template",
    "unbalanced_template",
    "bad_placeholder",
    "project_verb",
    "verb_replaced",
    "project_extra",
    "included",
    "inherits",
    "detached/pkg",
    "outer_pkg",
]

# `outer_pkg/inner` is neither a member nor a dependency of one. It carries a
# `[workspace]` table of its own — which is the rule it demonstrates, the walk
# for a project lexicon stopping at a directory whose manifest opens a
# workspace — and cargo refuses a workspace that holds a second root, whether it
# reached it through `members` or through a member's path dependencies. Nothing
# here may name it: `exclude` governs membership and not the dependency graph,
# so an excluded package a member depends on is loaded all the same and the
# refusal stands, with no member checked at all. The harness therefore checks it
# in a run of its own and merges the two reports.
