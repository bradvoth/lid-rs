[package]
name = "lid-rs-macros"
version.workspace = true
description = "Citation macros for lid-rs: derive(Spec), implements, validates, implements_module, spec."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lid", "intent", "traceability", "specification", "proc-macro"]
categories = ["development-tools", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[lints]
workspace = true

# A proc-macro crate links into no binary: this slice's claims, companion
# module, and fixtures live in the crate that re-exports its macros.
[package.metadata.lid_rs]
companion = "lid-rs"
