# The LID-rs gate (README §4.5), cheapest and most specific first. Every step
# gates; the toolchain is pinned by rust-toolchain.toml, which `rustup show`
# installs.
name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      # A fresh clone has run no `cargo lid-rs sync`, so it registers the
      # synced hooks itself, as sync does on a developer's machine; the
      # gate's `sync --check` then verifies the files and this config alike.
      - run: git config core.hooksPath .lid-rs/hooks
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links" cargo doc --no-deps
      - run: cargo test --doc
      # cargo-mutants must exist before `cargo test --lib`: the gate
      # self-test's vacuous_test fixture spawns it (check 12's demonstration).
      - run: cargo install cargo-mutants --locked
      - run: cargo test --lib
      - run: cargo package -p lid-rs -p lid-rs-macros -p cargo-lid-rs --allow-dirty
      - run: cargo run -p cargo-lid-rs -- sync --check
      - run: cargo run -p cargo-lid-rs -- mutants --diff-base origin/main
      # The book is assembled by inclusion; a renamed anchor or moved doc
      # breaks its build, and that breakage gates here, not only at deploy.
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook build book
