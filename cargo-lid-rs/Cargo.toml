[package]
name = "cargo-lid-rs"
version.workspace = true
description = "Check 12 for LID-rs projects: registry-scoped mutation testing as a cargo subcommand."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lid", "cargo-subcommand", "mutation-testing", "traceability", "testing"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]

[dependencies]
glob = "0.3.4"
lid-rs = { path = "../lid-rs", version = "0.3.6" }
lid-rs-shape.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
ureq = { version = "3.4.0", features = ["json"] }

[lints]
workspace = true
