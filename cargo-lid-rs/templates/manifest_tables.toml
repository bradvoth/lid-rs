
# LID-rs (README §7): lint levels, mutation scope, and the mutation-safe test
# profile. Thresholds live in clippy.toml.
[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
cognitive_complexity = "warn"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
wildcard_enum_match_arm = "deny"
missing_docs_in_private_items = "warn"

[package.metadata.lid_rs]
mutation_scope = "diff"

# README §4.3: inlining must not erase a mutation site.
[profile.test]
opt-level = 0
